name: suraj_approval
description: "freelancing project for Suraj Ltd. to manage approval requests"
version: 0.0.1+1
publish_to: none

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
#  shared_component: ^0.3.4
  sidebarx: ^0.17.1
  font_awesome_flutter: ^10.8.0
  responsive_builder: ^0.7.1
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3
