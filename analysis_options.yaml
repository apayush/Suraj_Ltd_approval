include: package:flutter_lints/flutter.yaml

analyzer:
  #  exclude: [**/*.g.dart, **/*.freezed.dart]  # Ignore generated files
  strong-mode:
    implicit-casts: false   # No implicit type conversions
    implicit-dynamic: false # Ban `dynamic` entirely
  errors:
    # Elevate warnings to errors
    missing_required_param: error   # Required parameters must be provided
    invalid_override: error     # Override methods correctly
    unused_import: warning      # Remove unused imports

linter:
  rules:
    # Null Safety
    avoid_null_checks_in_equality: error  # Use `== null` → `??`
    unnecessary_nullable: error           # Flags redundant `?` (e.g., `String? name = "Alice"`)
    prefer_if_null_operators: error       # Use `??` instead of `if (x == null) { x = y; }`

    # Performance
    prefer_const_constructors: error      # Forces `const` widgets
    avoid_unnecessary_containers: error   # Prevents redundant widget layers
    sized_box_for_whitespace: error       # Replace `Container(height: 10)` with `SizedBox(height: 10)`

    # Readability
    require_trailing_commas: error        # Reduces Git diff noise
    always_specify_types: error           # Bans `var x = 1` → `int x = 1`
    prefer_final_locals: error            # Forces `final` over `var` for locals

    # Organization
    sort_constructors_first: error        # Ensures constructors appear first in classes
    sort_pub_dependencies: error          # Alphabetizes `pubspec.yaml` dependencies
    prefer_single_quotes: true            # Uncomment to enable the `prefer_single_quotes` rule
    avoid_dynamic: warning               # Warns against `dynamic` types
    avoid_renaming_method_parameters: error # Keeps parameter names consistent
    prefer_is_empty: error                # Forces `list.isEmpty` over `list.length == 0`

    # Security
    avoid_print: error                    # Use `debugPrint` instead of `print`